<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nexia PromptHub</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
      // 🔴 ඔයාගේ FIREBASE CONFIG එක මෙතන දාන්න (පරණ ෆයිල් එකෙන් කොපි කරලා)
      const firebaseConfig = {
        apiKey: "AIzaSyBNdUnvdffGt9bJgwZsJXcPulomN4M1Lbs",
        authDomain: "prompthub-e69f8.firebaseapp.com",
        projectId: "prompthub-e69f8",
        storageBucket: "prompthub-e69f8.firebasestorage.app",
        messagingSenderId: "876000777567",
        appId: "1:876000777567:web:1927dd9d1bd037678792ea"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const auth = firebase.auth();

      // App.jsx එකට ලේසියෙන් ඩේටා ගන්න window.fb එක හදනවා (මේ ටික වෙනස් කරන්න එපා)
      window.fb = {
        auth, 
        db, 
        appId: firebaseConfig.appId,
        googleProvider: new firebase.auth.GoogleAuthProvider(),
        githubProvider: new firebase.auth.GithubAuthProvider(),
        twitterProvider: new firebase.auth.TwitterAuthProvider(),
        EmailAuthProvider: firebase.auth.EmailAuthProvider,
        signInWithPopup: firebase.auth().signInWithPopup.bind(auth),
        signInWithEmailAndPassword: firebase.auth().signInWithEmailAndPassword.bind(auth),
        createUserWithEmailAndPassword: firebase.auth().createUserWithEmailAndPassword.bind(auth),
        updateProfile: (user, data) => user.updateProfile(data),
        onAuthStateChanged: firebase.auth().onAuthStateChanged.bind(auth),
        signInAnonymously: firebase.auth().signInAnonymously.bind(auth),
        isSignInWithEmailLink: firebase.auth().isSignInWithEmailLink.bind(auth),
        signInWithEmailLink: firebase.auth().signInWithEmailLink.bind(auth),
        signOut: firebase.auth().signOut.bind(auth),
        deleteUser: (user) => user.delete(),
        reauthenticateWithCredential: (user, cred) => user.reauthenticateWithCredential(cred),
        reauthenticateWithPopup: (user, provider) => user.reauthenticateWithPopup(provider),
        doc: (db, ...paths) => db.doc(paths.join('/')),
        collection: (db, ...paths) => db.collection(paths.join('/')),
        setDoc: (ref, data, options) => ref.set(data, options),
        getDoc: (ref) => ref.get(),
        updateDoc: (ref, data) => ref.update(data),
        deleteDoc: (ref) => ref.delete(),
        addDoc: (ref, data) => ref.add(data),
        onSnapshot: (ref, onNext, onError) => ref.onSnapshot(onNext, onError),
        serverTimestamp: firebase.firestore.FieldValue.serverTimestamp,
        arrayUnion: firebase.firestore.FieldValue.arrayUnion,
        arrayRemove: firebase.firestore.FieldValue.arrayRemove,
        increment: firebase.firestore.FieldValue.increment
      };

      // Firebase ලෝඩ් වුණා කියලා React එකට Signal එක දෙනවා
      const event = new Event('firebase-ready');
      window.dispatchEvent(event);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
