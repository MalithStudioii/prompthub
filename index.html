<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nexia PromptHub</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBNdUnvdffGt9bJgwZsJXcPulomN4M1Lbs",
        authDomain: "prompthub-e69f8.firebaseapp.com",
        projectId: "prompthub-e69f8",
        storageBucket: "prompthub-e69f8.firebasestorage.app",
        messagingSenderId: "876000777567",
        appId: "1:876000777567:web:1927dd9d1bd037678792ea"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const auth = firebase.auth();

      // Core Bridge Implementation
      window.fb = {
        auth, 
        db, 
        appId: "prompthub-e69f8", // Legacy App ID configured for continuous data access
        googleProvider: new firebase.auth.GoogleAuthProvider(),
        githubProvider: new firebase.auth.GithubAuthProvider(),
        twitterProvider: new firebase.auth.TwitterAuthProvider(),
        EmailAuthProvider: firebase.auth.EmailAuthProvider,
        
        signInWithPopup: (a, provider) => a.signInWithPopup(provider),
        signInWithEmailAndPassword: (a, email, password) => a.signInWithEmailAndPassword(email, password),
        createUserWithEmailAndPassword: (a, email, password) => a.createUserWithEmailAndPassword(email, password),
        updateProfile: (user, data) => user.updateProfile(data),
        onAuthStateChanged: (a, callback) => a.onAuthStateChanged(callback),
        signInAnonymously: (a) => a.signInAnonymously(),
        isSignInWithEmailLink: (a, link) => a.isSignInWithEmailLink(link),
        signInWithEmailLink: (a, email, link) => a.signInWithEmailLink(email, link),
        signOut: (a) => a.signOut(),
        deleteUser: (user) => user.delete(),
        reauthenticateWithCredential: (user, cred) => user.reauthenticateWithCredential(cred),
        reauthenticateWithPopup: (user, provider) => user.reauthenticateWithPopup(provider),
        
        doc: (d, ...paths) => d.doc(paths.join('/')),
        collection: (d, ...paths) => d.collection(paths.join('/')),
        setDoc: (ref, data, options) => ref.set(data, options),
        updateDoc: (ref, data) => ref.update(data),
        deleteDoc: (ref) => ref.delete(),
        addDoc: (ref, data) => ref.add(data),
        serverTimestamp: firebase.firestore.FieldValue.serverTimestamp,
        arrayUnion: firebase.firestore.FieldValue.arrayUnion,
        arrayRemove: firebase.firestore.FieldValue.arrayRemove,
        increment: firebase.firestore.FieldValue.increment,

        // Extended wrappers to prevent exists() type errors
        getDoc: (ref) => ref.get().then(snap => ({
            exists: () => snap.exists,
            data: () => snap.data(),
            id: snap.id,
            ref: snap.ref
        })),
        onSnapshot: (ref, onNext, onError) => ref.onSnapshot(snap => {
            if (snap.docs) {
                onNext(snap);
            } else {
                onNext({
                    exists: () => snap.exists,
                    data: () => snap.data(),
                    id: snap.id,
                    ref: snap.ref
                });
            }
        }, onError)
      };

      // Dispatch load completion event
      const event = new Event('firebase-ready');
      window.dispatchEvent(event);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
